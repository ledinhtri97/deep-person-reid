model:
  name: 'deit_base_patch16'
  pretrained: True
  load_weights: 'new_log1906/deit_base_patch16/model/model.pth.tar-20'

data:
  type: 'image'
  sources: ['market1501']
  targets: ['market1501']
  height: 224
  width: 224
  combineall: False
  transforms: ['random_flip']
  save_dir: 'new_log1906/deit_base_patch16'

loss:
  name: 'softmax'
  softmax:
    label_smooth: True

train:
  optim: 'amsgrad'
  lr: 0.0015
  max_epoch: 20
  batch_size: 64
  fixbase_epoch: 10
  open_layers: ['classifier']
  lr_scheduler: 'single_step'
  stepsize: [20]

test:
  batch_size: 256
  dist_metric: 'cosine'
  normalize_feature: False
  evaluate: False
  visrank: False
  eval_freq: 2
  rerank: False
  start_eval: 2
