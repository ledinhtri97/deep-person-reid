model:
  name: 'osnet_ain_x1_0'
  pretrained: True
  load_weights: 'model.pth.tar-10'
  resume: 'model.pth.tar-10'

data:
  type: 'image'
  sources: ['market1501']
  targets: ['market1501']
  height: 256
  width: 128
  combineall: False
  transforms: ['random_flip', 'color_jitter']
  save_dir: 'resutls/osnet_ain_x1_0_market1501_softmax/241021'

loss:
  name: 'softmax'
  softmax:
    label_smooth: True

train:
  optim: 'amsgrad'
  lr: 0.002
  max_epoch: 50
  batch_size: 512
  fixbase_epoch: 10
  open_layers: ['classifier']
  lr_scheduler: 'cosine'

test:
  batch_size: 256
  dist_metric: 'cosine'
  normalize_feature: False
  evaluate: False
  visrank: False
  eval_freq: 2
  rerank: False
  start_eval: 2